name: ci

on:
  push:
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run compile
      - run: npm run export:abi
      - run: npm test
      - run: npm run web:build
